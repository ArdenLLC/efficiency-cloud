name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      K1: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      K2: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      U1: ${{ secrets.VITE_SUPABASE_URL }}
      U2: ${{ vars.VITE_SUPABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build
        run: |
          set -eo pipefail
          S="$GITHUB_STEP_SUMMARY"

          Z=$(ls *.zip 2>/dev/null | head -1 || true)
          if [ -z "$Z" ]; then echo "::error::仓库根目录没有 zip"; exit 1; fi
          rm -rf app && mkdir app
          unzip -q "$Z" -d app
          P=$(ls app/package.json app/*/package.json 2>/dev/null | head -1 || true)
          if [ -z "$P" ]; then echo "::error::zip 里没有 package.json"; find app -maxdepth 3; exit 1; fi
          DIR=$(cd "$(dirname "$P")" && pwd)
          echo "工程目录 = $DIR" >> "$5"
                    cp work/efficiency-cloud-v1/app.js "$DIR/app.js"
          grep -qF "gridColumn='1/-1'" "$DIR/app.js" || { echo "::error::app.js 没有界面收尾补丁"; exit 1; }
          echo "app.js 已用 work/ 版本覆盖" >> "$S"

          K=""
          for v in "$K1" "$K2"; do if [ -z "$K" ] && [ -n "$v" ]; then K="$v"; fi; done
          K=$(printf '%s' "$K" | tr -d '[:space:]"' | cut -d"'" -f1)
          if [ -z "$K" ]; then
            K=$(grep -hEo 'eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}' "$DIR"/.env* 2>/dev/null | head -1 || true)
          fi
          echo "原始 key 长度 = ${#K}" >> "$S"
          echo "签名段长度 = ${#K}" >> "$S"

          REF=$(node -e 'try{const p=JSON.parse(Buffer.from(process.argv[1].split(".")[1],"base64url").toString());process.stdout.write(p.ref||"")}catch(e){}' "$K" 2>/dev/null || true)
          ROLE=$(node -e 'try{const p=JSON.parse(Buffer.from(process.argv[1].split(".")[1],"base64url").toString());process.stdout.write(p.role||"")}catch(e){}' "$K" 2>/dev/null || true)
          echo "ref = ${REF:-解不出} / role = ${ROLE:-未知}" >> "$S"

          U=""
          for v in "$U1" "$U2"; do
            v=$(printf '%s' "$v" | tr -d '[:space:]' | sed 's#/rest/v1/*$##; s#/*$##')
            [ -n "$v" ] && U="$v" && break
          done
          [ -n "$REF" ] && U="https://$REF.supabase.co"
          echo "项目地址 = $U" >> "$S"

          probe() {
            local k="$1" code
            code=$(curl -s -m 15 -o /dev/null -w '%{http_code}' "$U/rest/v1/" -H "apikey: $k" -H "Authorization: Bearer $k" 2>/dev/null || true)
            printf '%s' "${code:-000}"
          }

          GOOD="$K"
          C1=$(probe "$K")
          echo "原样试探 → HTTP $C1" >> "$S"

          if [ "$C1" != "200" ]; then
            echo "正在尝试自动修复密钥（补齐/去掉末位）…" >> "$S"
            ALPHA='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_'
            i=0
            while [ $i -lt ${#ALPHA} ]; do
              ch=$(printf '%s' "$ALPHA" | cut -c$((i+1)))
              cand="$K$ch"
              if [ "$(probe "$cand")" = "200" ]; then
                GOOD="$cand"
                echo "✅ 自动修复成功：原 key 末尾缺一位，补上「$ch」后有效（新长度 ${#cand}）" >> "$S"
                break
              fi
              i=$((i+1))
            done

            if [ "$GOOD" = "$K" ]; then
              cand="${K%?}"
              if [ "$(probe "$cand")" = "200" ]; then
                GOOD="$cand"
                echo "✅ 自动修复成功：原 key 多了一位，去掉末位后有效（新长度 ${#cand}）" >> "$S"
              fi
            fi
          fi

          if [ "$GOOD" = "$K" ] && [ "$C1" != "200" ]; then
            BODY=$(curl -s -m 15 "$U/rest/v1/" -H "apikey: $K" -H "Authorization: Bearer $K" 2>/dev/null | head -c 200 || true)
            echo "⚠️ 密钥未能验证通过（HTTP $C1），仍然继续打包" >> "$S"
            echo "　服务端返回：$BODY" >> "$S"
            echo "　如果 App 里仍报未配置，请回后台『API Keys』点复制按钮重取 anon key 覆盖 secret" >> "$S"
          else
            echo "密钥验证 = 通过（HTTP 200）" >> "$S"
          fi

          ENVF="$DIR/.env.production.local"
          {
            for pre in VITE REACT_APP NEXT_PUBLIC; do
              echo "${pre}_SUPABASE_URL=$U"
              echo "${pre}_SUPABASE_ANON_KEY=$GOOD"
            done
            echo "SUPABASE_URL=$U"
            echo "SUPABASE_ANON_KEY=$GOOD"
          } > "$ENVF"
          if [ -f "$DIR/.env" ]; then
            sed -i '/SUPABASE_URL=/d; /SUPABASE_ANON_KEY=/d; /SUPABASE_KEY=/d' "$DIR/.env"
            cat "$ENVF" >> "$DIR/.env"
          else
            cp "$ENVF" "$DIR/.env"
          fi

          cd "$DIR"
          npm install --no-audit --no-fund > /tmp/npm.log 2>&1 || npm install --no-audit --no-fund --legacy-peer-deps > /tmp/npm.log 2>&1 || { tail -40 /tmp/npm.log; exit 1; }
          npm run build > /tmp/build.log 2>&1 || { tail -60 /tmp/build.log; exit 1; }

          WEB=""
          for d in dist build out; do if [ -f "$d/index.html" ]; then WEB="$d"; fi; done
          if [ -z "$WEB" ]; then echo "::error::没有 index.html"; ls -la; exit 1; fi
          if grep -rqF "${REF:-$GOOD}" "$WEB"; then
            echo "注入状态 = OK" >> "$S"
          else
            echo "注入状态 = 未确认" >> "$S"
          fi

          npm i -D @capacitor/cli > /dev/null 2>&1 || true
          npm i @capacitor/core @capacitor/android > /dev/null 2>&1 || true
          if [ ! -f capacitor.config.ts ] && [ ! -f capacitor.config.json ]; then
            npx cap init app com.efficiency.cloud --web-dir "$WEB"
          fi
          npx cap add android > /dev/null 2>&1 || true
          npx cap sync android 2>&1 | tail -15

          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon 2>&1 | tail -50
          echo "--- APK ---" >> "$S"
          find "$DIR" -name '*.apk' >> "$S" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk
          path: '**/*.apk'
          if-no-files-found: warn
