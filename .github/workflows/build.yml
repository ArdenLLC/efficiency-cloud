name: Build APK from zip
on:
  push:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_APP_URL: ${{ vars.VITE_APP_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          mkdir work
          unzip -q "$(ls *.zip | head -1)" -d work
          P=$(dirname "$(find work -name package.json -not -path '*/node_modules/*' | head -1)")
          echo "PROJECT=$P" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
      - name: Build debug APK
        working-directory: ${{ env.PROJECT }}
        run: bash scripts/build-apk.sh debug
      - uses: actions/upload-artifact@v4
        with:
          name: efficiency-cloud-apk
          path: ${{ env.PROJECT }}/android/app/build/outputs/apk/debug/app-debug.apk
