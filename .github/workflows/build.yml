name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 解压并定位
        id: locate
        run: |
          set -e
          ZIP=$(find . -maxdepth 3 -name "*.zip" -not -path "./.git/*" | head -1)
          if [ -z "$ZIP" ]; then echo "::error::仓库里没有 zip"; exit 1; fi
          echo ">>> 压缩包: $ZIP"
          echo "===== 包内前 60 条 ====="
          unzip -l "$ZIP" | head -60

          rm -rf extract && mkdir -p extract
          unzip -q -o "$ZIP" -d extract

          echo "===== 解压后（前 80 条）====="
          find extract -maxdepth 3 | head -80

          PKG=$(find extract -name package.json -not -path "*/node_modules/*" -maxdepth 4 | head -1)
          if [ -n "$PKG" ]; then
            echo "kind=node" >> "$GITHUB_OUTPUT"
            echo "web=$(dirname "$PKG")" >> "$GITHUB_OUTPUT"
            echo ">>> 是 Node 工程"
          else
            IDX=$(find extract -name index.html -not -path "*/node_modules/*" -maxdepth 4 | head -1)
            if [ -z "$IDX" ]; then echo "::error::既没有 package.json 也没有 index.html"; exit 1; fi
            echo "kind=static" >> "$GITHUB_OUTPUT"
            echo "web=$(dirname "$IDX")" >> "$GITHUB_OUTPUT"
            echo ">>> 是纯静态站点"
          fi

      - uses: actions/setup-node@v4
        if: steps.locate.outputs.kind == 'node'
        with:
          node-version: 22

      - name: 构建前端（注入 Supabase 变量）
        if: steps.locate.outputs.kind == 'node'
        run: |
          set -e
          WEB="${{ steps.locate.outputs.web }}"
          {
            echo "VITE_SUPABASE_URL=https://jublxlcaeetlkvfnsfgoj.supabase.co"
            echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}"
            echo "NEXT_PUBLIC_SUPABASE_URL=https://jublxlcaeetlkvfnsfgoj.supabase.co"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}"
          } > "$WEB/.env"
          echo ">>> .env 已写入，KEY 长度 = $(echo -n "${{ secrets.VITE_SUPABASE_ANON_KEY }}" | wc -c)"
          cd "$WEB"
          npm install --no-audit --no-fund
          npm run build

      - name: 确定要打包的目录
        id: dist
        run: |
          set -e
          WEB="${{ steps.locate.outputs.web }}"
          if [ "${{ steps.locate.outputs.kind }}" = "node" ]; then
            SRC=""
            for d in dist build out public; do
              if [ -f "$WEB/$d/index.html" ]; then SRC="$WEB/$d"; break; fi
            done
            [ -z "$SRC" ] && SRC="$WEB"
          else
            SRC="$WEB"
          fi
          echo "src=$SRC" >> "$GITHUB_OUTPUT"
          echo ">>> 打包来源 = $SRC"
          ls -a "$SRC" | head -30

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: 生成 Android WebView 壳
        run: |
          set -e
          APP=$(pwd)/gen
          mkdir -p "$APP/app/src/main/java/com/efficiencycloud/app"
          mkdir -p "$APP/app/src/main/assets/www"

          cat > "$APP/settings.gradle" <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "effcloud"
          include(":app")
          EOF

          cat > "$APP/build.gradle" <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF

          cat > "$APP/app/build.gradle" <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.efficiencycloud.app'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.efficiencycloud.app'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > "$APP/app/src/main/AndroidManifest.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:label="效率云" android:allowBackup="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > "$APP/app/src/main/java/com/efficiencycloud/app/MainActivity.java" <<'EOF'
          package com.efficiencycloud.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView web;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  web = new WebView(this);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  web.setWebViewClient(new WebViewClient());
                  web.setWebChromeClient(new WebChromeClient());
                  web.loadUrl("file:///android_asset/www/index.html");
                  setContentView(web);
              }

              @Override
              public void onBackPressed() {
                  if (web != null && web.canGoBack()) web.goBack();
                  else super.onBackPressed();
              }
          }
          EOF

          cat > "$APP/gradle.properties" <<'EOF'
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m
          EOF
          echo ">>> 壳工程完成"

      - name: 塞进网页并打 APK
        run: |
          set -e
          APP=$(pwd)/gen
          SRC="${{ steps.dist.outputs.src }}"
          cp -r "$SRC"/. "$APP/app/src/main/assets/www/"
          ls -a "$APP/app/src/main/assets/www" | head -30
          cd "$APP"
          gradle assembleDebug --no-daemon --console=plain
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/app-debug.apk"
          ls -lh "$GITHUB_WORKSPACE/app-debug.apk"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk
          path: app-debug.apk
          if-no-files-found: warn
