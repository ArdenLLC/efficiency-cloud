name: Build APK from zip

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: android-actions/setup-android@v3
      - name: Inspect zip
        run: |
          ls -la
          unzip -l *.zip | head -200
      - name: Unpack
        run: |
          mkdir -p work
          unzip -q -o *.zip -d work
          ls -la work
      - name: Build
        run: |
          set -x
          PJ=$(find work -maxdepth 4 -name package.json -not -path '*/node_modules/*' | head -1)
          if [ -n "$PJ" ]; then ROOT=$(dirname "$PJ"); else ROOT="work"; fi
          echo "ROOT=$ROOT"
          cd "$ROOT"
          if [ -f scripts/build-apk.sh ]; then
            bash scripts/build-apk.sh || true
            if [ -n "$(find . -name '*.apk' -print -quit)" ]; then
              echo "APK built by project script"
              exit 0
            fi
          fi
          if [ -n "$PJ" ]; then
            npm install --no-audit --no-fund || true
            npm run build --if-present || true
          fi
          if ! ls capacitor.config.* >/dev/null 2>&1; then
            npm init -y >/dev/null 2>&1 || true
            npm i -D @capacitor/cli >/dev/null 2>&1 || true
            npm i @capacitor/core @capacitor/android >/dev/null 2>&1 || true
            mkdir -p www
            if [ -d dist ]; then cp -r dist/. www/; elif [ -d build ]; then cp -r build/. www/; else cp -r . www/ 2>/dev/null || true; fi
            npx --yes cap init app com.example.app --web-dir www
            npx --yes cap add android
          fi
          npx --yes cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: efficiency-cloud-apk
          path: '**/*.apk'
          if-no-files-found: warn
