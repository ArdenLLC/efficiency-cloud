name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SB_URL: ${{ secrets.VITE_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://jublxlcaeetlkvfnsfgoj.supabase.co' }}
      SB_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 写入环境变量
        run: |
          if [ -z "$SB_KEY" ]; then
            echo "::error::找不到 anon key。请在 Settings → Secrets and variables → Actions 里加 VITE_SUPABASE_ANON_KEY"
            exit 1
          fi
          {
            echo "VITE_SUPABASE_URL=$SB_URL"
            echo "VITE_SUPABASE_ANON_KEY=$SB_KEY"
            echo "NEXT_PUBLIC_SUPABASE_URL=$SB_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$SB_KEY"
            echo "VITE_AI_ENDPOINT=$SB_URL/functions/v1/ai"
          } >> .env
          echo "URL: $SB_URL"
          echo "KEY 长度: ${#SB_KEY}"

      - name: 安装依赖并构建
        run: |
          if [ -f package-lock.json ]; then npm ci || npm install; else npm install; fi
          if node -e "const s=require('./package.json').scripts||{};process.exit(s.build?0:1)"; then
            npm run build
          else
            echo "package.json 里没有 build 脚本，跳过"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 打包 APK
        run: |
          if ls capacitor.config.* >/dev/null 2>&1; then
            npx cap sync android
          fi
          if [ -d android ]; then
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          else
            echo "::error::仓库里没有 android/ 目录，无法产出 APK"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
