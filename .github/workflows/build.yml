name: Build APK

on:
  push:
  workflow_dispatch:
  
  
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Unpack and install deps
        run: |
          set -x
          S=$GITHUB_STEP_SUMMARY
          Z=$(ls *.zip | head -1)
          echo "ZIP=$Z" >> $S
          rm -rf app && mkdir app
          unzip -q -o "$Z" -d app
          echo '### zip 第一层' >> $S
          echo '```' >> $S
          ls -la app >> $S
          echo '```' >> $S
          P=$(ls app/package.json app/*/package.json 2>/dev/null | head -1)
          echo "PACKAGE_JSON=$P" >> $S
          if [ -z "$P" ]; then
            echo '```' >> $S
            find app -maxdepth 3 >> $S
            echo '```' >> $S
            exit 1
          fi
          echo "ROOT=$(dirname "$P")" >> $GITHUB_ENV
          cd "$(dirname "$P")"
          ls -la
          echo "VITE_SUPABASE_URL=https://jublxlcaeetlkvfnsfgoj.supabase.co" >> .en
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env
          npm install --no-audit --no-fund 2>&1 | tail -40
          npm run build 2>&1 | tail -60
          ls -la

      - name: Package with Capacitor
        run: |
          set -x
          S=$GITHUB_STEP_SUMMARY
          cd "$ROOT"
          WEB=""
          for d in dist build www out public .; do
            if [ -f "$d/index.html" ]; then WEB=$d; break; fi
          done
          echo "WEB=$WEB" >> $S
          if [ -z "$WEB" ]; then
            echo "error: no index.html found" >> $S
            find . -maxdepth 2 -name 'index.html' | head >> $S
            exit 1
          fi
          npm i -D @capacitor/cli 2>&1 | tail -5
          npm i @capacitor/core @capacitor/android 2>&1 | tail -5
          [ -f capacitor.config.ts ] || [ -f capacitor.config.json ] || npx cap init app com.arden.app --web-dir "$WEB"
          [ -d android ] || npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon 2>&1 | tail -80

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk
          path: '**/*.apk'
          if-no-files-found: warn
