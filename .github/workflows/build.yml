name: Build APK

on:
  push:
  workflow_dispatch:

env:
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
  VITE_APP_URL: ${{ vars.VITE_APP_URL }}

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          set -x
          SDK=/usr/local/lib/android/sdk
          BT=$(ls -d $SDK/build-tools/* | sort -V | tail -1)
          PLAT=$(ls -d $SDK/platforms/android-* | sort -V | tail -1)
          API=$(basename "$PLAT" | sed 's/android-//')
          JAR="$PLAT/android.jar"
          echo "BT=$BT API=$API"
          rm -rf work out
          mkdir -p work out
          Z=$(ls *.zip | head -1)
          unzip -q -o "$Z" -d work || true
          ls -la work

          G=$(find work -maxdepth 4 -name gradlew -print -quit)
          if [ -n "$G" ]; then
            D=$(dirname "$G")
            echo "sdk.dir=$SDK" > "$D/local.properties"
            ( cd "$D" && chmod +x gradlew && ./gradlew assembleDebug --no-daemon ) || true
          fi

          if [ -z "$(find work -name '*.apk' -print -quit)" ]; then
            P=$(ls work/package.json work/*/package.json 2>/dev/null | head -1)
            if [ -n "$P" ]; then
              R=$(dirname "$P")
              ( cd "$R" && npm install --no-audit --no-fund && npm run build ) || true
            fi
            W=""
            for d in dist build www out public; do
              F=$(find work -maxdepth 4 -path "*/$d/index.html" -print -quit)
              if [ -n "$F" ]; then W=$(dirname "$F"); break; fi
            done
            if [ -z "$W" ]; then
              F=$(find work -maxdepth 4 -name index.html -print -quit)
              if [ -n "$F" ]; then W=$(dirname "$F"); fi
            fi
            echo "WEB=$W"
            if [ -n "$W" ]; then
              mkdir -p out/src/com/arden/app out/res/values out/assets/www
              cp -r "$W"/. out/assets/www/
              cat > out/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources><string name="app_name">efficiency-cloud</string></resources>
          EOF
              cat > out/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.arden.app">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:label="@string/app_name" android:usesCleartextTraffic="true" android:theme="@android:style/Theme.NoTitleBar">
              <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|keyboardHidden">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
              cat > out/src/com/arden/app/MainActivity.java <<'EOF'
          package com.arden.app;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
            private WebView wv;
            @Override protected void onCreate(Bundle b) {
              super.onCreate(b);
              wv = new WebView(this);
              WebSettings s = wv.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setDatabaseEnabled(true);
              s.setAllowFileAccess(true);
              s.setAllowFileAccessFromFileURLs(true);
              s.setAllowUniversalAccessFromFileURLs(true);
              s.setMediaPlaybackRequiresUserGesture(false);
              wv.setWebViewClient(new WebViewClient());
              setContentView(wv);
              wv.loadUrl("file:///android_asset/www/index.html");
            }
            @Override public void onBackPressed() {
              if (wv != null && wv.canGoBack()) { wv.goBack(); } else { super.onBackPressed(); }
            }
          }
          EOF
              javac -source 8 -target 8 -classpath "$JAR" -d out/classes out/src/com/arden/app/MainActivity.java
              mkdir -p out/dex
              "$BT/d8" --lib "$JAR" --min-api 21 --output out/dex out/classes/com/arden/app/*.class
              "$BT/aapt2" compile --dir out/res -o out/res.zip
              "$BT/aapt2" link -o out/app.unsigned.apk -I "$JAR" --manifest out/AndroidManifest.xml -R out/res.zip -A out/assets --min-sdk-version 21 --target-sdk-version "$API" --auto-add-overlay
              ( cd out/dex && zip -q ../app.unsigned.apk classes.dex )
              keytool -genkeypair -keystore out/debug.keystore -alias a -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=a" >/dev/null 2>&1
              "$BT/zipalign" -f 4 out/app.unsigned.apk out/app.aligned.apk
              "$BT/apksigner" sign --ks out/debug.keystore --ks-pass pass:android --key-pass pass:android --out out/efficiency-cloud.apk out/app.aligned.apk
            fi
          fi
          find . -name '*.apk' -print

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk
          path: '**/*.apk'
          if-no-files-found: warn
