name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inspect
        run: |
          set +e
          D="$GITHUB_WORKSPACE/diag.txt"
          : > "$D"
          echo "PWD=$(pwd)" >> "$D"
          Z=$(ls *.zip 2>/dev/null | head -1)
          echo "ZIP=$Z" >> "$D"
          echo "::warning::ZIP=${Z}"
          mkdir -p work
          unzip -q -o "$Z" -d work >> "$D" 2>&1
          ls -la work >> "$D"
          find work -maxdepth 3 >> "$D"
          for d in $(ls work | head -6); do echo "::warning::work/$d"; done

      - name: Build
        continue-on-error: true
        run: |
          set -x
          D="$GITHUB_WORKSPACE/diag.txt"
          P=$(ls work/package.json work/*/package.json work/*/*/package.json 2>/dev/null | head -1)
          if [ -n "$P" ]; then ROOT=$(dirname "$P"); else ROOT=work; fi
          echo "ROOT=$ROOT" | tee -a "$D"
          cd "$ROOT"
          ls -la
          if [ -f package.json ]; then
            npm install --no-audit --no-fund || true
            npm run build || true
          fi
          if [ -f android/gradlew ]; then
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee -a "$D"
            exit 0
          fi
          WEB=""
          for d in dist build www out public; do
            if [ -d "$d" ]; then WEB="$d"; break; fi
          done
          if [ -z "$WEB" ]; then
            mkdir -p www
            cp -r ./*.html ./*.js ./*.css ./assets ./public www/ 2>/dev/null || true
            WEB=www
          fi
          echo "WEB=$WEB" | tee -a "$D"
          [ -f package.json ] || npm init -y
          npm i -D @capacitor/cli || true
          npm i @capacitor/core @capacitor/android || true
          [ -f capacitor.config.ts ] || [ -f capacitor.config.json ] || npx cap init App com.example.app --web-dir "$WEB" || true
          [ -d android ] || npx cap add android || true
          npx cap sync android || true
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee -a "$D"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk-and-logs
          path: |
            **/*.apk
            diag.txt
          if-no-files-found: warn
