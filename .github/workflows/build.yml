name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      K1: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      K2: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      K3: ${{ secrets.SUPABASE_ANON_KEY }}
      K4: ${{ vars.SUPABASE_ANON_KEY }}
      U1: ${{ secrets.VITE_SUPABASE_URL }}
      U2: ${{ vars.VITE_SUPABASE_URL }}
      U3: ${{ secrets.SUPABASE_URL }}
      U4: ${{ vars.SUPABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build
        run: |
          set -eo pipefail
          S="$GITHUB_STEP_SUMMARY"

          Z=$(ls *.zip 2>/dev/null | head -1 || true)
          if [ -z "$Z" ]; then echo "::error::仓库根目录没有 zip"; exit 1; fi
          rm -rf app && mkdir app
          unzip -q "$Z" -d app
          P=$(ls app/package.json app/*/package.json 2>/dev/null | head -1 || true)
          if [ -z "$P" ]; then echo "::error::zip 里没有 package.json"; find app -maxdepth 3; exit 1; fi
          DIR=$(cd "$(dirname "$P")" && pwd)
          echo "工程目录 = $DIR" >> "$S"

          # ---------- 取 key ----------
          K=""
          for v in "$K1" "$K2" "$K3" "$K4"; do
            if [ -z "$K" ] && [ -n "$v" ]; then K="$v"; fi
          done
          K=$(printf '%s' "$K" | tr -d '[:space:]')
          if [ -z "$K" ]; then
            K=$(grep -hEo 'eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}' "$DIR"/.env* 2>/dev/null | head -1 || true)
          fi
          if [ -z "$K" ]; then echo "::error::没找到 Supabase anon key"; exit 1; fi
          echo "key 长度 = ${#K}" >> "$S"

          # ---------- 从 key 里解出真实 ref / role ----------
          REF=$(node -e 'try{const p=JSON.parse(Buffer.from(process.argv[1].split(".")[1],"base64url").toString());process.stdout.write(p.ref||"")}catch(e){}' "$K")
          ROLE=$(node -e 'try{const p=JSON.parse(Buffer.from(process.argv[1].split(".")[1],"base64url").toString());process.stdout.write(p.role||"")}catch(e){}' "$K")
          echo "key 里的项目 ref = ${REF:-（解不出）}" >> "$S"
          echo "key 的 role = ${ROLE:-（未知）}" >> "$S"
          if [ "$ROLE" = "service_role" ]; then echo "::error::这是 service_role，不能放进客户端，请改用 anon key"; exit 1; fi

          # ---------- 候选地址：key 推出来的排第一 ----------
          C=()
          [ -n "$REF" ] && C+=("https://$REF.supabase.co")
          for v in "$U1" "$U2" "$U3" "$U4"; do
            v=$(printf '%s' "$v" | tr -d '[:space:]' | sed 's#/rest/v1/*$##; s#/*$##')
            [ -n "$v" ] && C+=("$v")
          done
          for f in "$DIR"/.env*; do
            [ -f "$f" ] || continue
            v=$(grep -hEo 'https://[a-z0-9]+\.supabase\.co' "$f" 2>/dev/null | head -1 || true)
            [ -n "$v" ] && C+=("$v")
          done

          U=""
          LAST=""
          for c in "${C[@]}"; do
            dup=0
            for used in $LAST; do [ "$used" = "$c" ] && dup=1; done
            [ $dup -eq 1 ] && continue
            LAST="$LAST $c"
            code=$(curl -s -m 15 -o /dev/null -w '%{http_code}' "$c/rest/v1/" -H "apikey: $K" -H "Authorization: Bearer $K" || true)
            [ -z "$code" ] && code=000
            echo "检测 $c → $code" >> "$S"
            if [ "$code" = "200" ]; then U="$c"; break; fi
          done

          if [ -z "$U" ]; then
            echo "::error::所有候选地址都验证失败。key 里的 ref=${REF}，请拿它和 Supabase 后台的 Project URL 对一下"
            exit 1
          fi
          echo "最终使用地址 = $U" >> "$S"
          echo "Supabase 返回码 = 200" >> "$S"

          # ---------- 写 env（各种前缀都写，不管源码用哪种都能吃到）----------
          ENVF="$DIR/.env.production.local"
          {
            for pre in VITE REACT_APP NEXT_PUBLIC; do
              echo "${pre}_SUPABASE_URL=$U"
              echo "${pre}_SUPABASE_ANON_KEY=$K"
            done
            echo "SUPABASE_URL=$U"
            echo "SUPABASE_ANON_KEY=$K"
          } > "$ENVF"
          if [ -f "$DIR/.env" ]; then
            sed -i '/SUPABASE_URL=/d; /SUPABASE_ANON_KEY=/d; /SUPABASE_KEY=/d' "$DIR/.env"
            cat "$ENVF" >> "$DIR/.env"
          else
            cp "$ENVF" "$DIR/.env"
          fi

          cd "$DIR"
          npm install --no-audit --no-fund > /tmp/npm.log 2>&1 || npm install --no-audit --no-fund --legacy-peer-deps > /tmp/npm.log 2>&1 || { tail -40 /tmp/npm.log; exit 1; }
          npm run build > /tmp/build.log 2>&1 || { tail -50 /tmp/build.log; exit 1; }

          WEB=""
          for d in dist build out; do
            if [ -f "$d/index.html" ]; then WEB="$d"; fi
          done
          if [ -z "$WEB" ]; then echo "::error::没有 index.html"; ls -la; exit 1; fi
          if grep -rqF "$REF" "$WEB" 2>/dev/null; then
            echo "Supabase 注入状态 = OK" >> "$S"
          else
            echo "Supabase 注入状态 = 未确认（不影响出包，装上看）" >> "$S"
          fi

          npm i -D @capacitor/cli > /dev/null 2>&1 || true
          npm i @capacitor/core @capacitor/android > /dev/null 2>&1 || true
          if [ ! -f capacitor.config.ts ] && [ ! -f capacitor.config.json ]; then
            npx cap init app com.efficiency.cloud --web-dir "$WEB"
          fi
          npx cap add android > /dev/null 2>&1 || true
          npx cap sync android 2>&1 | tail -15

          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon 2>&1 | tail -50
          find "$DIR" -name '*.apk' >> "$S" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk
          path: '**/*.apk'
          if-no-files-found: warn
