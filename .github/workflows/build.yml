name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      K1: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      K2: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      U1: ${{ secrets.VITE_SUPABASE_URL }}
      U2: ${{ vars.VITE_SUPABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build
        run: |
          set -eo pipefail
          S=$GITHUB_STEP_SUMMARY
          Z=$(ls *.zip 2>/dev/null | head -1 || true)
          if [ -z "$Z" ]; then echo "::error::根目录没有 zip"; exit 1; fi
          rm -rf app
          mkdir app
          unzip -q "$Z" -d app
          P=$(ls app/package.json app/*/package.json 2>/dev/null | head -1 || true)
          if [ -z "$P" ]; then echo "::error::zip 里没有 package.json"; exit 1; fi
          DIR=$(dirname "$P")
          echo "工程目录 = $DIR" >> "$S"
          cp -f work/efficiency-cloud-v1/app.js "$DIR/app.js"
          echo "app.js 行数 = $(wc -l < "$DIR/app.js")" >> "$S"
          K=$(printf '%s' "${K1:-$K2}" | tr -d '[:space:]"')
          if [ -z "$K" ]; then K=$(grep -hoE 'eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+' "$DIR"/.env* 2>/dev/null | head -1 || true); fi
          U=$(printf '%s' "${U1:-$U2}" | tr -d '[:space:]')
          if [ -z "$U" ]; then
            REF=$(node -e 'try{process.stdout.write(JSON.parse(Buffer.from(process.argv[1].split(".")[1],"base64url")).ref||"")}catch(e){}' "$K")
            U="https://$REF.supabase.co"
          fi
          echo "key 长度 = ${#K} / 地址 = $U" >> "$S"
          ENVF="$DIR/.env.production.local"
          {
            for pre in VITE REACT_APP NEXT_PUBLIC; do
              echo "${pre}_SUPABASE_URL=$U"
              echo "${pre}_SUPABASE_ANON_KEY=$K"
            done
            echo "SUPABASE_URL=$U"
            echo "SUPABASE_ANON_KEY=$K"
          } > "$ENVF"
          if [ -f "$DIR/.env" ]; then
            sed -i '/SUPABASE_URL=/d; /SUPABASE_ANON_KEY=/d; /SUPABASE_KEY=/d' "$DIR/.env"
            cat "$ENVF" >> "$DIR/.env"
          else
            cp "$ENVF" "$DIR/.env"
          fi
          cd "$DIR"
          npm install --no-audit --no-fund > /tmp/npm.log 2>&1 || npm install --no-audit --no-fund --legacy-peer-deps > /tmp/npm.log 2>&1
          npm run build > /tmp/build.log 2>&1
          WEB=""
          for d in dist build out; do if [ -f "$d/index.html" ]; then WEB="$d"; fi; done
          if [ -z "$WEB" ]; then echo "::error::没有 index.html"; exit 1; fi
          echo "产物目录 = $WEB" >> "$S"
          npm i -D @capacitor/cli > /dev/null 2>&1 || true
          npm i @capacitor/core @capacitor/android > /dev/null 2>&1 || true
          if [ ! -f capacitor.config.ts ] && [ ! -f capacitor.config.json ]; then
            npx cap init app com.efficiency.cloud --web-dir "$WEB"
          fi
          npx cap add android > /dev/null 2>&1 || true
          npx cap sync android 2>&1 | tail -15
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon 2>&1 | tail -50
          find . -name '*.apk' >> "$S"
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: '**/*.apk'
          if-no-files-found: error
