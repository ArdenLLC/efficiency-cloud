name: iOS IPA (unsigned)
on:
  workflow_dispatch:
jobs:
  ipa:
    runs-on: macos-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_APP_URL: ${{ vars.VITE_APP_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm run build
      - name: Create iOS project
        run: |
          [ -d ios ] || npx cap add ios
          node scripts/make-ios-icon.mjs
          npx cap sync ios
      - name: Build unsigned app
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -sdk iphoneos \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr EfficiencyCloud.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: efficiency-cloud-ipa, path: EfficiencyCloud.ipa }
